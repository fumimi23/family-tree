name: バグ報告
description: 動作の不具合・想定外の挙動を報告する
labels:
  - bug
body:
  - type: textarea
    id: phenomenon
    attributes:
      label: 現象
      description: 何が起きたかを簡潔に
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 再現手順
      description: 手順を箇条書きで
      value: |
        1.
        2.
        3.
  - type: textarea
    id: expected
    attributes:
      label: 期待する挙動
  - type: textarea
    id: environment
    attributes:
      label: 環境
      description: ブラウザ / OS / Node バージョン 等
