enableScripts: false

nodeLinker: node-modules

npmMinimalAgeGate: 4320

# 直接攻撃面のない dev / transitive のみで、上位パッケージの patch が
# ecosystem に未到着のものを audit から除外する。定期的に再評価する。
npmAuditExcludePackages:
  # fsevents (macOS only, optional dep) → node-gyp → 古い tar
  - tar
  - node-gyp
  - glob
  # eslint-plugin-react / file-entry-cache が依存する古い minimatch / flatted
  - minimatch
  - flatted
  - brace-expansion
  # socks-proxy-agent (npm/yarn registry 内部) → ip-address
  - ip-address
  # cosmiconfig (commitlint) → 古い js-yaml / yaml
  - js-yaml
  - yaml
  # anymatch (chokidar/Vite watcher) → picomatch ReDoS
  - picomatch
